<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Życie Chrystusa — Chronologiczna oś czasu</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0e17;
      --surface: #1a1928;
      --border: #2e2d45;
      --accent: #c9a84c;
      --accent-light: #e8c97a;
      --text: #e8e6f0;
      --text-muted: #8e8aaa;
      --line: #3a3860;

      --cat-prologue:       #a0a0c8;
      --cat-infancy:        #7a9ec4;
      --cat-birth:          #6b9e6b;
      --cat-early-life:     #7a9ec4;
      --cat-ministry-start: #c97a4a;
      --cat-teaching:       #9e7abf;
      --cat-miracle:        #4ab8c9;
      --cat-milestone:      #c4a44a;
      --cat-passion-week:   #bf4a4a;
      --cat-resurrection:   #c9a84c;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 60px 24px 40px;
      background: linear-gradient(180deg, #16152a 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
    }

    header .subtitle {
      font-family: 'Arial', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }

    header h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: normal;
      color: var(--text);
      line-height: 1.15;
    }

    header h1 span { color: var(--accent); }

    header p {
      margin-top: 16px;
      color: var(--text-muted);
      font-style: italic;
      font-size: 1rem;
      max-width: 480px;
      margin-inline: auto;
    }

    /* ── Section heading ── */
    .section-heading {
      max-width: 800px;
      margin: 56px auto 0;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      user-select: none;
    }

    .section-heading::before,
    .section-heading::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
      transition: background 0.2s;
    }

    .section-heading:hover::before,
    .section-heading:hover::after {
      background: var(--accent);
    }

    .section-heading-inner {
      text-align: center;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .section-heading-inner h2 {
      font-size: 1.1rem;
      font-weight: normal;
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    .section-heading-inner span {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: 'Arial', sans-serif;
      font-style: italic;
    }

    .section-toggle {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-family: 'Arial', sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }

    .section-heading:hover .section-toggle {
      color: var(--accent);
    }

    .section-toggle-arrow {
      display: inline-block;
      transition: transform 0.3s ease;
    }

    .section-heading.collapsed .section-toggle-arrow {
      transform: rotate(-90deg);
    }

    /* ── Timeline ── */
    .timeline {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      position: relative;
      overflow: hidden;
      transition: max-height 0.4s ease, opacity 0.3s ease, padding 0.3s ease;
      max-height: 99999px;
      opacity: 1;
    }

    .timeline.collapsed {
      max-height: 0 !important;
      opacity: 0;
      padding-top: 0;
      padding-bottom: 0;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--line);
      transform: translateX(-50%);
    }

    /* ── Events ── */
    .event {
      display: grid;
      grid-template-columns: 1fr 48px 1fr;
      gap: 0 16px;
      margin-bottom: 40px;
      align-items: start;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .event.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .event:nth-child(odd)  .event-card { grid-column: 1; grid-row: 1; }
    .event:nth-child(odd)  .event-dot  { grid-column: 2; grid-row: 1; }
    .event:nth-child(odd)  .event-meta { grid-column: 3; grid-row: 1; }

    .event:nth-child(even) .event-meta { grid-column: 1; grid-row: 1; text-align: right; }
    .event:nth-child(even) .event-dot  { grid-column: 2; grid-row: 1; }
    .event:nth-child(even) .event-card { grid-column: 3; grid-row: 1; }

    .event-dot {
      display: flex;
      justify-content: center;
      padding-top: 8px;
    }

    .event-dot .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid var(--bg);
      box-shadow: 0 0 0 1px var(--accent);
      flex-shrink: 0;
    }

    .event-meta {
      padding-top: 6px;
    }

    .event-year {
      font-size: 0.85rem;
      color: var(--accent);
      font-family: 'Arial', sans-serif;
      font-weight: bold;
      letter-spacing: 0.04em;
    }

    .event-location {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-style: italic;
    }

    .event-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .event-card:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 24px rgba(201, 168, 76, 0.1);
    }

    .event-card h3 {
      font-size: 0.95rem;
      font-weight: normal;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .event-card p {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.65;
    }

    .event-scripture {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.75rem;
      color: var(--accent-light);
      font-style: italic;
      font-family: 'Arial', sans-serif;
    }

    /* category dot colors */
    .dot-infancy        { background: var(--cat-infancy) !important;        box-shadow: 0 0 0 1px var(--cat-infancy) !important; }
    .dot-birth          { background: var(--cat-birth) !important;          box-shadow: 0 0 0 1px var(--cat-birth) !important; }
    .dot-early-life     { background: var(--cat-early-life) !important;     box-shadow: 0 0 0 1px var(--cat-early-life) !important; }
    .dot-ministry-start { background: var(--cat-ministry-start) !important; box-shadow: 0 0 0 1px var(--cat-ministry-start) !important; }
    .dot-teaching       { background: var(--cat-teaching) !important;       box-shadow: 0 0 0 1px var(--cat-teaching) !important; }
    .dot-miracle        { background: var(--cat-miracle) !important;        box-shadow: 0 0 0 1px var(--cat-miracle) !important; }
    .dot-milestone      { background: var(--cat-milestone) !important;      box-shadow: 0 0 0 1px var(--cat-milestone) !important; }
    .dot-passion-week   { background: var(--cat-passion-week) !important;   box-shadow: 0 0 0 1px var(--cat-passion-week) !important; }
    .dot-resurrection   { background: var(--cat-resurrection) !important;   box-shadow: 0 0 0 1px var(--cat-resurrection) !important; }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      header {
        padding: 36px 16px 28px;
      }

      header p {
        font-size: 0.9rem;
      }

      .section-heading {
        margin-top: 36px;
        padding: 12px 16px;
        min-height: 48px;
      }

      .section-heading-inner h2 {
        font-size: 0.95rem;
      }

      .timeline {
        padding: 24px 16px 48px;
      }

      /* Single-column layout: line on left, dot + card stacked */
      .timeline::before {
        left: 20px;
        transform: none;
      }

      .event {
        grid-template-columns: 40px 1fr;
        grid-template-rows: auto auto;
        gap: 4px 12px;
        margin-bottom: 28px;
      }

      /* Reset even/odd overrides */
      .event:nth-child(odd)  .event-card,
      .event:nth-child(even) .event-card {
        grid-column: 2;
        grid-row: 2;
        text-align: left;
      }

      .event:nth-child(odd)  .event-dot,
      .event:nth-child(even) .event-dot {
        grid-column: 1;
        grid-row: 1;
      }

      .event:nth-child(odd)  .event-meta,
      .event:nth-child(even) .event-meta {
        grid-column: 2;
        grid-row: 1;
        text-align: left;
      }

      .event-dot {
        justify-content: center;
        padding-top: 4px;
      }

      .event-card {
        padding: 12px 14px;
      }

      .event-card h3 {
        font-size: 0.9rem;
      }

      .event-card p {
        font-size: 0.8rem;
      }

      .event-meta {
        padding-top: 2px;
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }

      .event-location {
        margin-top: 0;
      }
    }
  </style>
</head>
<body>

<header>
  <p class="subtitle">Kronika Chronologiczna</p>
  <h1>Życie <span>Chrystusa</span></h1>
  <p>Od Wcielenia do Wniebowstąpienia</p>
</header>

<div id="app"></div>

<script>
  async function init() {
    const app = document.getElementById('app');

    const manifestRes = await fetch('data/manifest.json');
    const sectionFiles = await manifestRes.json();

    const sections = await Promise.all(
      sectionFiles.map(f => fetch(f).then(r => r.json()))
    );

    sections.forEach(section => {
      const heading = buildSectionHeading(section);
      const timeline = buildTimeline(section.events);
      heading.addEventListener('click', () => toggleSection(heading, timeline));
      app.appendChild(heading);
      app.appendChild(timeline);
    });

    observeEvents();
  }

  function buildSectionHeading(section) {
    const el = document.createElement('div');
    el.className = 'section-heading';
    el.innerHTML = `
      <div class="section-heading-inner">
        <h2>${section.title}</h2>
        <span>${section.period ?? ''}</span>
        <div class="section-toggle">
          <span class="section-toggle-arrow">▾</span> zwiń / rozwiń
        </div>
      </div>
    `;
    return el;
  }

  function toggleSection(heading, timeline) {
    const isCollapsed = timeline.classList.toggle('collapsed');
    heading.classList.toggle('collapsed', isCollapsed);
    if (!isCollapsed) observeEvents();
  }

  function buildTimeline(events) {
    const timeline = document.createElement('div');
    timeline.className = 'timeline';
    events.forEach(event => timeline.appendChild(buildEventEl(event)));
    return timeline;
  }

  function buildEventEl(event) {
    const el = document.createElement('article');
    el.className = 'event';

    const dotClass = `dot-${event.category ?? 'milestone'}`;

    el.innerHTML = `
      <div class="event-card">
        <h3>${event.title}</h3>
        <p>${event.description}</p>
        <span class="event-scripture">${event.scripture}</span>
      </div>
      <div class="event-dot"><div class="dot ${dotClass}"></div></div>
      <div class="event-meta">
        <div class="event-year">${event.year ?? ''}</div>
        <div class="event-location">${event.location ?? ''}</div>
      </div>
    `;
    return el;
  }

  function observeEvents() {
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.event:not(.visible)').forEach(el => observer.observe(el));
  }

  init();
</script>

</body>
</html>
